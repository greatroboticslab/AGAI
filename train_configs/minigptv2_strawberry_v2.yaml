# MiniGPT-v2 Strawberry Diagnostic Training Config v2
# Changes from v1:
#   - max_txt_len: 160 → 500 (capture full symptom descriptions)
#   - lora_r: 16 → 64 (4x more capacity for image-specific learning)
#   - lora_alpha: 32 → 128 (scaled with rank)
#   - init_lr: 3e-5 → 1e-5 (slower learning to preserve details)
#   - max_epoch: 10 → 20 (more training iterations)

model:
  arch: minigpt_v2
  model_type: pretrain
  max_txt_len: 500          # CHANGED: Was 160, now captures full responses
  end_sym: "</s>"
  llama_model: "/data/AGAI/MiniGPT-4/llama_weights/Llama-2-7b-chat-hf"
  ckpt: "/data/AGAI/MiniGPT-4/checkpoints/checkpoint_stage2.pth"
  use_grad_checkpoint: true
  low_resource: true
  chat_template: true
  lora_r: 64                # CHANGED: Was 16, increased for image-specific capacity
  lora_alpha: 128           # CHANGED: Was 32, scaled 2x with lora_r
  lora_dropout: 0.05

datasets:
  strawberry_diagnostic:
    data_type: images
    build_info:
      annotations:
        train:
          storage: "/data/AGAI/MiniGPT-4/plant_diagnostic/datasets/stage2_train_7class_fixed.json"
      images:
        train: "/data/AGAI/MiniGPT-4/plant_diagnostic/data/train_aug"
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 448
      eval:
        name: "blip2_image_eval"
        image_size: 448
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
    batch_size: 2

run:
  task: image_text_pretrain
  output_dir: "/data/AGAI/MiniGPT-4/output"    # Base output folder
  iters_per_epoch: 2000     # CHANGED: Was 1500, more iterations per epoch
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5             # CHANGED: Was 3e-5, slower learning
  min_lr: 5e-6              # CHANGED: Was 1e-5
  warmup_lr: 1e-6
  warmup_steps_ratio: 0.05

  weight_decay: 0.05
  max_epoch: 20             # CHANGED: Was 10, more epochs
  num_workers: 4
  seed: 42

  # Per-GPU batch; 2 GPUs × 2 batch × 8 accum = effective 32
  batch_size_train: 2
  accumulation_steps: 8
  amp: true
  max_grad_norm: 1.0

  # Dist settings
  distributed: true
  dist_url: "env://"
  device: "cuda"

  # Logging / ckpt
  wandb_log: false
  job_name: "minigpt_strawberry"    # Output folder name
  resume_ckpt_path: null
  evaluate: true
  train_splits: ["train"]
  val_splits: ["val"]
  max_val_steps: 50
  auto_val_split_ratio: 0.1

