# Strawberry Plant Parts Segmentation Dataset
# For YOLOv8 Segmentation training - preserves polygon precision

path: /data/AGAI/MiniGPT-4/yolo_parts/dataset_seg
train: images/train
val: images/val

# Classes - strawberry plant parts (7 classes, no calyx)
names:
  0: leaf       # Leaves, foliage
  1: fruit      # Berries at any ripeness stage
  2: flower     # Blossoms, blooms, petals
  3: crown      # Central plant crown
  4: stem       # Stems, petioles, runners
  5: root       # Roots - for root rot detection
  6: soil       # Visible soil/mulch

# Number of classes
nc: 7
